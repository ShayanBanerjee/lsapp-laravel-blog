<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Abstract machine-room diagram">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1017"/><stop offset="100%" stop-color="#03060a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#3ddbd9" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="gl" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#g)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <g>
    <rect x="90" y="80" width="1020" height="590" rx="8" fill="none" stroke="#2b3f4d" stroke-width="1.5"/>
    <rect x="170" y="150" width="860" height="450" rx="8" fill="none" stroke="#3a5568" stroke-width="1.5"/>
    <rect x="270" y="225" width="660" height="300" rx="8" fill="none" stroke="#4d7186" stroke-width="1.5"/>
    <rect x="390" y="298" width="420" height="154" rx="8" fill="#0d1218" stroke="#3ddbd9" stroke-opacity="0.6" stroke-width="2"/>
  </g>
  <g fill="#3ddbd9" font-family="ui-monospace,monospace" font-size="19" letter-spacing="2">
    <text x="112" y="112" fill-opacity="0.34">DISK</text>
    <text x="192" y="182" fill-opacity="0.46">RAM</text>
    <text x="292" y="257" fill-opacity="0.62">L2</text>
    <text x="412" y="330" fill-opacity="0.95">L1</text>
  </g>
  <g filter="url(#gl)">
    <circle cx="600" cy="392" r="7" fill="#3ddbd9"/>
  </g>
  <g fill="none" stroke="#3ddbd9" stroke-opacity="0.30" stroke-width="1.4" stroke-dasharray="5 7">
    <path d="M600 298 V150 M600 452 V600 M390 375 H170 M810 375 H1030"/>
  </g>
</svg>
