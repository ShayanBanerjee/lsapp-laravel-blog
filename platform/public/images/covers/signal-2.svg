<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Abstract machine-room diagram">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1017"/><stop offset="100%" stop-color="#03060a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#3ddbd9" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="gl" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#g)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <g stroke="#5e7d92" stroke-opacity="0.34" stroke-width="1.2" fill="none">
    <path d="M600 130 L340 300 M600 130 L600 300 M600 130 L860 300"/>
    <path d="M340 300 L210 470 M340 300 L400 470 M600 300 L560 470 M600 300 L700 470
             M860 300 L820 470 M860 300 L980 470"/>
    <path d="M210 470 L150 620 M210 470 L280 620 M400 470 L370 620 M560 470 L520 620
             M700 470 L680 620 M820 470 L800 620 M980 470 L930 620 M980 470 L1050 620"/>
  </g>
  <g fill="#0d1218" stroke="#3a5568" stroke-width="1.3">
    <circle cx="340" cy="300" r="16"/><circle cx="600" cy="300" r="16"/><circle cx="860" cy="300" r="16"/>
  </g>
  <g fill="#0d1218" stroke="#2b3f4d" stroke-width="1.1">
    <circle cx="210" cy="470" r="11"/><circle cx="400" cy="470" r="11"/><circle cx="560" cy="470" r="11"/>
    <circle cx="700" cy="470" r="11"/><circle cx="820" cy="470" r="11"/><circle cx="980" cy="470" r="11"/>
    <circle cx="150" cy="620" r="8"/><circle cx="280" cy="620" r="8"/><circle cx="370" cy="620" r="8"/>
    <circle cx="520" cy="620" r="8"/><circle cx="680" cy="620" r="8"/><circle cx="800" cy="620" r="8"/>
    <circle cx="1050" cy="620" r="8"/>
  </g>
  <g filter="url(#gl)">
    <circle cx="600" cy="130" r="20" fill="#0d1218" stroke="#3ddbd9" stroke-width="2.4"/>
    <circle cx="930" cy="620" r="8" fill="#e8734a"/>
  </g>
</svg>
