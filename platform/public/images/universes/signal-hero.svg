<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A machine-room field of circuit traces and a signal trace on a phosphor grid">
  <!--
    Authored for Inkfathom's Signal universe.

    Drawn rather than photographed, for two reasons. The bundled photography is
    all landscape and none of it is a machine room; and imagery pulled from a
    web search would be someone else's copyrighted work. This is ours, it is a
    few kilobytes, and it stays sharp at any size.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1017"/>
      <stop offset="55%" stop-color="#05080d"/>
      <stop offset="100%" stop-color="#020406"/>
    </linearGradient>

    <radialGradient id="bloom" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#3ddbd9" stop-opacity="0.40"/>
      <stop offset="55%" stop-color="#1d7f8c" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- The fine graticule of an oscilloscope screen. -->
    <pattern id="graticule" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3ddbd9" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>

    <pattern id="graticuleMajor" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#3ddbd9" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#ground)"/>
  <rect width="1600" height="900" fill="url(#graticule)"/>
  <rect width="1600" height="900" fill="url(#graticuleMajor)"/>
  <rect width="1600" height="900" fill="url(#bloom)"/>

  <!-- Routed traces. Right angles and 45s, the way a board is actually laid out. -->
  <g fill="none" stroke="#3ddbd9" stroke-opacity="0.62" stroke-width="2" stroke-linecap="square">
    <path d="M0 176 H236 l44 44 H612 l40-40 H1064 l52 52 H1600"/>
    <path d="M0 292 H150 l60 60 H470 l38-38 H905 l64 64 H1600"/>
    <path d="M0 470 H318 l46-46 H735 l58 58 H1180 l40-40 H1600"/>
    <path d="M0 640 H196 l52 52 H590 l44-44 H1010 l60 60 H1600"/>
    <path d="M0 784 H420 l48-48 H860 l40 40 H1600"/>
  </g>

  <g fill="none" stroke="#7ea6bd" stroke-opacity="0.42" stroke-width="1.3" stroke-linecap="square">
    <path d="M180 0 V150 l40 40 V560 l-38 38 V900"/>
    <path d="M520 0 V240 l44 44 V690 V900"/>
    <path d="M980 0 V120 l-42 42 V520 l46 46 V900"/>
    <path d="M1320 0 V330 l40 40 V760 V900"/>
  </g>

  <!-- Vias: the little plated holes a trace passes through. -->
  <g fill="#05080d" stroke="#3ddbd9" stroke-opacity="0.85" stroke-width="1.8">
    <circle cx="236" cy="176" r="4.5"/><circle cx="612" cy="176" r="4.5"/>
    <circle cx="470" cy="352" r="4.5"/><circle cx="905" cy="314" r="4.5"/>
    <circle cx="735" cy="424" r="4.5"/><circle cx="1180" cy="482" r="4.5"/>
    <circle cx="590" cy="692" r="4.5"/><circle cx="1010" cy="648" r="4.5"/>
    <circle cx="420" cy="784" r="4.5"/><circle cx="860" cy="736" r="4.5"/>
  </g>

  <!-- Packages. Deliberately plain: a chip is a black rectangle with legs. -->
  <g>
    <rect x="640" y="356" width="300" height="188" rx="6" fill="#101922" stroke="#436075" stroke-width="1.8"/>
    <rect x="640" y="356" width="300" height="188" rx="6" fill="none" stroke="#3ddbd9" stroke-opacity="0.40" stroke-width="1.2"/>
    <g stroke="#8fb6cc" stroke-opacity="0.75" stroke-width="2.8" stroke-linecap="round">
      <path d="M616 392H640M616 428H640M616 464H640M616 500H640"/>
      <path d="M940 392H964M940 428H964M940 464H964M940 500H964"/>
    </g>
    <circle cx="664" cy="380" r="5" fill="none" stroke="#3ddbd9" stroke-opacity="0.85" stroke-width="1.6"/>
    <rect x="676" y="430" width="112" height="5" rx="2.5" fill="#3ddbd9" fill-opacity="0.85"/>
    <rect x="676" y="446" width="72" height="5" rx="2.5" fill="#3ddbd9" fill-opacity="0.55"/>
    <rect x="676" y="462" width="150" height="5" rx="2.5" fill="#3ddbd9" fill-opacity="0.34"/>
  </g>

  <g fill="#101922" stroke="#436075" stroke-width="1.5">
    <rect x="196" y="586" width="132" height="82" rx="4"/>
    <rect x="1204" y="228" width="150" height="94" rx="4"/>
    <rect x="1120" y="632" width="104" height="66" rx="4"/>
  </g>

  <!-- The trace itself: a clocked square wave decaying into a settled line. -->
  <g filter="url(#glow)">
    <path d="M0 812 H120 V742 H196 V812 H272 V742 H348 V812 H424 V742 H500 V812 H576 V742 H652 V812 H728
             C790 812 800 764 860 764 C920 764 930 800 990 800 C1050 800 1062 776 1122 776
             C1182 776 1196 790 1256 790 H1600"
          fill="none" stroke="#5ff0ee" stroke-opacity="1" stroke-width="3.2" stroke-linejoin="miter"/>
  </g>

  <!-- A second, quieter channel, offset like a differential pair. -->
  <g filter="url(#softGlow)">
    <path d="M0 852 H160 V818 H240 V852 H320 V818 H400 V852 H480 V818 H560 V852 H1600"
          fill="none" stroke="#3ddbd9" stroke-opacity="0.55" stroke-width="2"/>
  </g>

  <!-- Vignette, so text laid over this stays legible at any crop. -->
  <radialGradient id="vig" cx="50%" cy="50%" r="78%">
    <stop offset="55%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
